<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Sautéing illustration -->
  <title>Sautéing in Pan</title>

  <!-- Pan (ellipse for perspective) -->
  <ellipse cx="256" cy="220" rx="120" ry="30"
           fill="none" stroke="black" stroke-width="3"/>

  <!-- Pan side walls -->
  <line x1="136" y1="220" x2="136" y2="260"
        stroke="black" stroke-width="3"/>
  <line x1="376" y1="220" x2="376" y2="260"
        stroke="black" stroke-width="3"/>

  <!-- Pan bottom curve -->
  <path d="M 136 260 Q 256 280, 376 260"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Pan handle -->
  <line x1="136" y1="240" x2="80" y2="240"
        stroke="black" stroke-width="4"/>
  <circle cx="80" cy="240" r="8"
          fill="none" stroke="black" stroke-width="2"/>

  <!-- Food in pan (simple shapes) -->
  <circle cx="240" cy="240" r="12"
          fill="none" stroke="black" stroke-width="2"/>
  <circle cx="270" cy="235" r="10"
          fill="none" stroke="black" stroke-width="2"/>
  <circle cx="260" cy="255" r="11"
          fill="none" stroke="black" stroke-width="2"/>

  <!-- Steam lines -->
  <path d="M 230 200 Q 225 180, 230 160"
        fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 270 200 Q 265 180, 270 160"
        fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Stove burner (simple representation) -->
  <rect x="200" y="350" width="112" height="30"
        fill="none" stroke="black" stroke-width="2"/>
  <circle cx="256" cy="365" r="8"
          fill="none" stroke="black" stroke-width="1.5"/>
</svg>
