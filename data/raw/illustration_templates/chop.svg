<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Chopping/Dicing illustration -->
  <title>Chopping Vegetables</title>

  <!-- Cutting board -->
  <rect x="100" y="300" width="300" height="20"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Knife -->
  <line x1="200" y1="150" x2="250" y2="300"
        stroke="black" stroke-width="3"/>
  <line x1="250" y1="300" x2="260" y2="300"
        stroke="black" stroke-width="3"/>

  <!-- Knife handle -->
  <rect x="190" y="130" width="20" height="30"
        fill="none" stroke="black" stroke-width="2"/>

  <!-- Vegetable/ingredient being chopped -->
  <ellipse cx="280" cy="290" rx="25" ry="15"
           fill="none" stroke="black" stroke-width="2"/>

  <!-- Chopped pieces -->
  <circle cx="320" cy="295" r="8"
          fill="none" stroke="black" stroke-width="2"/>
  <circle cx="340" cy="295" r="8"
          fill="none" stroke="black" stroke-width="2"/>
  <circle cx="330" cy="310" r="8"
          fill="none" stroke="black" stroke-width="2"/>
</svg>
