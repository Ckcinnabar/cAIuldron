  <!-- Fork -->
  <line x1="332" y1="280" x2="292" y2="380"
        stroke="black" stroke-width="4"/>
  <line x1="285" y1="385" x2="285" y2="405"
        stroke="black" stroke-width="2"/>
  <line x1="292" y1="385" x2="292" y2="405"
        stroke="black" stroke-width="2"/>
  <line x1="299" y1="385" x2="299" y2="405"
