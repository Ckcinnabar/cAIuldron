  <path d="M 200 180 Q 230 140, 256 150 Q 282 140, 312 180"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Utensils crossed -->
  <!-- Spoon -->
  <line x1="180" y1="280" x2="220" y2="380"
        stroke="black" stroke-width="4"/>
  <ellipse cx="226" cy="390" rx="12" ry="18"
