<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Mixing illustration -->
  <title>Mixing in Bowl</title>

  <!-- Bowl (arc for perspective) -->
  <path d="M 150 200 L 140 280 Q 256 350, 372 280 L 362 200"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Bowl rim (ellipse top) -->
  <ellipse cx="256" cy="200" rx="106" ry="25"
           fill="none" stroke="black" stroke-width="3"/>

  <!-- Spoon/whisk -->
  <line x1="256" y1="120" x2="256" y2="270"
        stroke="black" stroke-width="4"/>

  <!-- Spoon head -->
  <ellipse cx="256" cy="280" rx="20" ry="12"
           fill="none" stroke="black" stroke-width="3"/>

  <!-- Handle grip -->
  <rect x="246" y="100" width="20" height="30"
        fill="none" stroke="black" stroke-width="2" rx="5"/>

  <!-- Motion lines (mixing action) -->
  <path d="M 220 240 Q 200 260, 220 280"
        fill="none" stroke="black" stroke-width="1.5"
        stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 290 240 Q 310 260, 290 280"
        fill="none" stroke="black" stroke-width="1.5"
        stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Ingredients in bowl (simple shapes) -->
  <circle cx="230" cy="240" r="6"
          fill="black" opacity="0.3"/>
  <circle cx="280" cy="245" r="5"
          fill="black" opacity="0.3"/>
  <circle cx="256" cy="250" r="4"
          fill="black" opacity="0.3"/>
</svg>
