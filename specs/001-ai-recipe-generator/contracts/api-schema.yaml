openapi: 3.0.3
info:
  title: AI Recipe Generator API
  description: API for generating recipes from ingredient photos using AI models
  version: 1.0.0
  contact:
    name: cAIuldron Team

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.example.com/api/v1
    description: Production server

paths:
  /recipes/generate:
    post:
      summary: Generate recipes from ingredient photo
      description: Upload a photo of an ingredient and receive 5-7 AI-generated recipe suggestions with nutritional information and cooking instructions
      operationId: generateRecipes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Photo of the ingredient (JPEG, PNG, or HEIC, max 10MB)
                preferences:
                  type: object
                  description: Optional user preferences for recipe filtering
                  properties:
                    cuisine_filter:
                      type: array
                      items:
                        type: string
                        enum: [asian, western, fusion, mediterranean, latin, african, middle_eastern]
                    max_time_minutes:
                      type: integer
                      minimum: 1
                    dietary_restrictions:
                      type: array
                      items:
                        type: string
                        enum: [vegetarian, vegan, gluten_free, dairy_free, nut_free]
      responses:
        '200':
          description: Successfully generated recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeGenerationResponse'
        '400':
          description: Bad request (invalid image, ingredient not recognized, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check endpoint
      description: Check if the API service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  models_loaded:
                    type: boolean

components:
  schemas:
    RecipeGenerationResponse:
      type: object
      required:
        - request_id
        - ingredient
        - recipes
        - generation_time_seconds
      properties:
        request_id:
          type: string
          format: uuid
        ingredient:
          $ref: '#/components/schemas/IngredientInfo'
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
          minItems: 5
          maxItems: 7
        generation_time_seconds:
          type: number
          format: float

    IngredientInfo:
      type: object
      required:
        - name
        - confidence
        - estimated_weight_grams
        - usda_id
      properties:
        name:
          type: string
          example: "chicken breast"
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          example: 0.94
        estimated_weight_grams:
          type: number
          format: float
          example: 285
        usda_id:
          type: string
          example: "171077"
        quality_assessment:
          type: string
          enum: [clear, unclear, too_far, multiple_items]
        alternative_matches:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              confidence:
                type: number

    Recipe:
      type: object
      required:
        - recipe_id
        - title
        - cuisine_type
        - difficulty
        - total_time_minutes
        - servings
        - ingredients
        - steps
        - nutrition
        - safety_validated
      properties:
        recipe_id:
          type: string
          format: uuid
        title:
          type: string
          example: "Teriyaki Chicken Stir-Fry"
        cuisine_type:
          type: string
          enum: [asian, western, fusion, mediterranean, latin, african, middle_eastern]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        total_time_minutes:
          type: integer
          example: 25
        prep_time_minutes:
          type: integer
          example: 10
        cook_time_minutes:
          type: integer
          example: 15
        servings:
          type: integer
          minimum: 1
          example: 2
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CookingStep'
        nutrition:
          $ref: '#/components/schemas/NutritionalInformation'
        equipment_required:
          type: array
          items:
            type: string
          example: ["wok", "cutting board", "knife"]
        safety_validated:
          type: boolean
        safety_warnings:
          type: array
          items:
            type: string
          example: ["Ensure chicken reaches internal temperature of 165°F (74°C)"]

    RecipeIngredient:
      type: object
      required:
        - name
        - quantity
        - unit
      properties:
        name:
          type: string
          example: "chicken breast"
        quantity:
          type: string
          example: "285"
        unit:
          type: string
          example: "g"
        optional:
          type: boolean
          default: false

    CookingStep:
      type: object
      required:
        - step_number
        - instruction
        - time_minutes
        - illustration_url
      properties:
        step_number:
          type: integer
          minimum: 1
          example: 1
        instruction:
          type: string
          example: "Cut chicken breast into bite-sized pieces"
        time_minutes:
          type: integer
          example: 3
        illustration_url:
          type: string
          format: uri
          example: "/illustrations/abc123-step1.png"
        techniques:
          type: array
          items:
            type: string
          example: ["dicing"]
        temperature_fahrenheit:
          type: integer
          example: 375

    NutritionalInformation:
      type: object
      required:
        - total_calories
        - calories_per_serving
        - protein_grams
        - carbs_grams
        - fat_grams
        - servings
      properties:
        total_calories:
          type: number
          example: 680
        calories_per_serving:
          type: number
          example: 340
        protein_grams:
          type: number
          example: 48
        carbs_grams:
          type: number
          example: 32
        fat_grams:
          type: number
          example: 12
        servings:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "ingredient_not_recognized"
        message:
          type: string
          example: "We couldn't identify a food ingredient in this photo. Please upload a clearer photo of a single ingredient."
        suggestions:
          type: array
          items:
            type: string
          example:
            - "Ensure good lighting"
            - "Use a plain background"
            - "Photograph only one ingredient"
